[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "constructsync"
version = "0.1.0"
description = "A high-concurrency catalog ingestion, quality assurance, and security sanitization pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "aiohttp>=3.9.3",
    "bleach>=6.1.0",
    "polars>=0.20.15",
    "pydantic-settings>=2.2.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "hypothesis>=6.98.15",
    "black>=24.2.0",
    "isort>=5.13.2",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "kagglehub>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
